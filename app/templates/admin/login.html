<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Girişi — {{ site_name }}</title>

  <!-- Tema — FOUC önleyici (Tailwind'den önce çalışmalı) -->
  <script>
    (function () {
      var stored = localStorage.getItem('theme') || 'system';
      var isDark = stored === 'dark' || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) document.documentElement.classList.add('dark');
    })();
  </script>

  <link rel="stylesheet" href="/static/css/tailwind.css?v={{ css_asset_v }}">
  <link rel="stylesheet" href="/static/css/app.css?v={{ css_asset_v }}">
  <script src="https://unpkg.com/lucide@1.24.0/dist/umd/lucide.min.js"></script>
  <meta name="csrf-token" content="{{ csrf_token(request) }}">
  <script src="/static/js/csrf.js"></script>
</head>
<body data-theme-color="{{ theme_color }}" class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4" style="--accent: {{ theme_accent_light }}; --accent-dark: {{ theme_accent_dark }}; --accent-surface: {{ theme_surface_light }}; --accent-surface-dark: {{ theme_surface_dark }}; --accent-border: {{ theme_border_light }}; --accent-border-dark: {{ theme_border_dark }};">

<!-- Tema seçici: Aydınlık / Karanlık / Sistem -->
<div class="fixed top-4 right-4 z-40" id="theme-menu-wrap">
  <button type="button" id="theme-toggle-btn"
    class="p-2 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-sm transition-colors"
    aria-label="Tema seç">
    <span data-theme-icon="light"><i data-lucide="sun" class="w-4.5 h-4.5"></i></span>
    <span data-theme-icon="dark" class="hidden"><i data-lucide="moon" class="w-4.5 h-4.5"></i></span>
    <span data-theme-icon="system" class="hidden"><i data-lucide="monitor" class="w-4.5 h-4.5"></i></span>
  </button>
  <div id="theme-menu" class="hidden absolute right-0 top-full mt-1 w-36 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-sm shadow-lg py-1 z-50">
    <button type="button" data-theme-option="light"
      class="theme-option-btn flex items-center gap-2 w-full px-3 py-1.5 text-sm text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
      <i data-lucide="sun" class="w-3.5 h-3.5"></i> Aydınlık
    </button>
    <button type="button" data-theme-option="dark"
      class="theme-option-btn flex items-center gap-2 w-full px-3 py-1.5 text-sm text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
      <i data-lucide="moon" class="w-3.5 h-3.5"></i> Karanlık
    </button>
    <button type="button" data-theme-option="system"
      class="theme-option-btn flex items-center gap-2 w-full px-3 py-1.5 text-sm text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
      <i data-lucide="monitor" class="w-3.5 h-3.5"></i> Sistem
    </button>
  </div>
</div>

<div class="w-full max-w-sm">

  <!-- Kart -->
  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-sm p-8 transition-colors">

    <!-- Logo -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 bg-blue-50 dark:bg-blue-500/10 border border-blue-100 dark:border-blue-500/20 rounded-sm flex items-center justify-center mb-3">
        <i data-lucide="{{ site_icon }}" class="w-6 h-6 site-icon-color"
          style="--site-icon-light: {{ site_icon_color_light }}; --site-icon-dark: {{ site_icon_color_dark }};"></i>
      </div>
      <h1 class="text-lg font-bold text-slate-900 dark:text-slate-100">Admin Girişi</h1>
      <p class="text-xs text-slate-400 dark:text-slate-500 mt-0.5">{{ site_name }}</p>
    </div>

    <!-- Hata mesajı -->
    {% if error %}
    <div class="flex items-center gap-2 px-3 py-2.5 mb-5 bg-red-50 dark:bg-red-500/10 border border-red-100 dark:border-red-500/20 rounded-sm">
      <i data-lucide="alert-circle" class="w-4 h-4 text-red-500 dark:text-red-400 shrink-0"></i>
      <p class="text-sm text-red-700 dark:text-red-400">{{ error }}</p>
    </div>
    {% endif %}

    <!-- Form -->
    <form method="post" action="/admin/login" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">

      <div>
        <label for="login-username" class="form-label">Kullanıcı Adı</label>
        <div class="relative">
          <i data-lucide="user" class="absolute left-2.5 top-2.5 w-3.5 h-3.5 text-slate-400 dark:text-slate-500 pointer-events-none"></i>
          <input
            id="login-username"
            type="text"
            name="username"
            autocomplete="username"
            autofocus
            required
            placeholder="admin"
            class="form-input form-input-icon">
        </div>
      </div>

      <div>
        <label for="login-password" class="form-label">Şifre</label>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-2.5 top-2.5 w-3.5 h-3.5 text-slate-400 dark:text-slate-500 pointer-events-none"></i>
          <input
            id="login-password"
            type="password"
            name="password"
            autocomplete="current-password"
            required
            placeholder="••••••••"
            class="form-input form-input-icon">
        </div>
      </div>

      <button id="login-submit" type="submit" class="btn-primary w-full justify-center py-2.5 mt-2">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        Giriş Yap
      </button>
    </form>

  </div>

  <!-- Alt link -->
  <p class="text-center text-xs text-slate-400 dark:text-slate-500 mt-4">
    <a href="/" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">← Ana Siteye Dön</a>
  </p>

</div>

<script>
  lucide.createIcons();

  // Tema seçici: Aydınlık / Karanlık / Sistem
  (function () {
    const menuWrap = document.getElementById('theme-menu-wrap');
    if (!menuWrap) return;
    const btn = document.getElementById('theme-toggle-btn');
    const menu = document.getElementById('theme-menu');
    const mql = window.matchMedia('(prefers-color-scheme: dark)');

    function isDarkFor(mode) {
      return mode === 'dark' || (mode === 'system' && mql.matches);
    }

    function applyTheme(mode, persist) {
      document.documentElement.classList.toggle('dark', isDarkFor(mode));
      if (persist) localStorage.setItem('theme', mode);

      btn.querySelectorAll('[data-theme-icon]').forEach((el) => el.classList.add('hidden'));
      const activeIcon = btn.querySelector('[data-theme-icon="' + mode + '"]');
      if (activeIcon) activeIcon.classList.remove('hidden');

      document.querySelectorAll('.theme-option-btn').forEach((opt) => {
        const active = opt.dataset.themeOption === mode;
        opt.classList.toggle('text-blue-600', active);
        opt.classList.toggle('dark:text-blue-400', active);
        opt.classList.toggle('bg-blue-50', active);
        opt.classList.toggle('dark:bg-blue-500/10', active);
      });
    }

    applyTheme(localStorage.getItem('theme') || 'system', false);

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      menu.classList.toggle('hidden');
    });
    document.addEventListener('click', (e) => {
      if (!menuWrap.contains(e.target)) menu.classList.add('hidden');
    });
    document.querySelectorAll('.theme-option-btn').forEach((opt) => {
      opt.addEventListener('click', () => {
        applyTheme(opt.dataset.themeOption, true);
        menu.classList.add('hidden');
      });
    });

    // Sistem teması değişirse ve seçili mod 'system' ise anında yansıt.
    mql.addEventListener('change', () => {
      if ((localStorage.getItem('theme') || 'system') === 'system') {
        applyTheme('system', false);
      }
    });
  })();
</script>
</body>
</html>
