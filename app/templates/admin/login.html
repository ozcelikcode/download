<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Girişi — {{ site_name }}</title>

  <!-- Tema — FOUC önleyici (Tailwind'den önce çalışmalı) -->
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (theme === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          borderRadius: { sm: '3px', DEFAULT: '3px' }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">

<!-- Tema değiştirici -->
<button type="button" data-theme-toggle
  class="fixed top-4 right-4 p-2 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-sm transition-colors"
  aria-label="Temayı değiştir">
  <span data-icon-sun><i data-lucide="sun" class="w-4.5 h-4.5"></i></span>
  <span data-icon-moon class="hidden"><i data-lucide="moon" class="w-4.5 h-4.5"></i></span>
</button>

<div class="w-full max-w-sm">

  <!-- Kart -->
  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-sm p-8 transition-colors">

    <!-- Logo -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 bg-blue-50 dark:bg-blue-500/10 border border-blue-100 dark:border-blue-500/20 rounded-sm flex items-center justify-center mb-3">
        <i data-lucide="download-cloud" class="w-6 h-6 text-blue-600 dark:text-blue-400"></i>
      </div>
      <h1 class="text-lg font-bold text-slate-900 dark:text-slate-100">Admin Girişi</h1>
      <p class="text-xs text-slate-400 dark:text-slate-500 mt-0.5">{{ site_name }}</p>
    </div>

    <!-- Hata mesajı -->
    {% if error %}
    <div class="flex items-center gap-2 px-3 py-2.5 mb-5 bg-red-50 dark:bg-red-500/10 border border-red-100 dark:border-red-500/20 rounded-sm">
      <i data-lucide="alert-circle" class="w-4 h-4 text-red-500 dark:text-red-400 shrink-0"></i>
      <p class="text-sm text-red-700 dark:text-red-400">{{ error }}</p>
    </div>
    {% endif %}

    <!-- Form -->
    <form method="post" action="/admin/login" class="space-y-4">

      <div>
        <label for="login-username" class="form-label">Kullanıcı Adı</label>
        <div class="relative">
          <i data-lucide="user" class="absolute left-2.5 top-2.5 w-3.5 h-3.5 text-slate-400 dark:text-slate-500 pointer-events-none"></i>
          <input
            id="login-username"
            type="text"
            name="username"
            autocomplete="username"
            autofocus
            required
            placeholder="admin"
            class="form-input pl-8">
        </div>
      </div>

      <div>
        <label for="login-password" class="form-label">Şifre</label>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-2.5 top-2.5 w-3.5 h-3.5 text-slate-400 dark:text-slate-500 pointer-events-none"></i>
          <input
            id="login-password"
            type="password"
            name="password"
            autocomplete="current-password"
            required
            placeholder="••••••••"
            class="form-input pl-8">
        </div>
      </div>

      <button id="login-submit" type="submit" class="btn-primary w-full justify-center py-2.5 mt-2">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        Giriş Yap
      </button>
    </form>

  </div>

  <!-- Alt link -->
  <p class="text-center text-xs text-slate-400 dark:text-slate-500 mt-4">
    <a href="/" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">← Ana Siteye Dön</a>
  </p>

</div>

<script>
  lucide.createIcons();

  // Tema (karanlık/aydınlık) değiştirici
  (function () {
    const toggleBtns = document.querySelectorAll('[data-theme-toggle]');
    function applyTheme(theme) {
      document.documentElement.classList.toggle('dark', theme === 'dark');
      localStorage.setItem('theme', theme);
      toggleBtns.forEach((btn) => {
        const sun = btn.querySelector('[data-icon-sun]');
        const moon = btn.querySelector('[data-icon-moon]');
        if (sun && moon) {
          sun.classList.toggle('hidden', theme === 'dark');
          moon.classList.toggle('hidden', theme !== 'dark');
        }
      });
    }
    applyTheme(document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    toggleBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
        applyTheme(next);
      });
    });
  })();
</script>
</body>
</html>
