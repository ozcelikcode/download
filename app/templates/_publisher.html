{% macro render(request, publisher, fallback='') %}
<span class="inline-flex items-center gap-1.5">
  <span>{{ publisher.username if publisher else fallback }}</span>
  {% if publisher and publisher.is_active and (publisher.role != 'editor' or publisher.is_verified) %}
  <i data-lucide="badge-check" class="w-4 h-4 shrink-0 publisher-badge--{{ publisher.role }}" role="img" aria-label="{{ t(request, 'verified_editor') if publisher.role == 'editor' else t(request, 'role_' ~ publisher.role) }}"></i>
  {% endif %}
</span>
{% endmacro %}
